name: Deploy infrastructure and app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:
  # ---------------------------------------------------------------- 1
  create-resources:
    name: 1. Create Resources
    runs-on: ubuntu-latest
    outputs:
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      webAppHostName: ${{ steps.deploy.outputs.webAppHostName }}
      sqlServerFqdn: ${{ steps.deploy.outputs.sqlServerFqdn }}
      databaseName: ${{ steps.deploy.outputs.databaseName }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Deploy Bicep template
        id: deploy
        run: |
          out=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters sqlAdminLogin='${{ secrets.SQL_ADMIN_LOGIN }}' \
                         sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' \
            --query properties.outputs --output json)
          for k in webAppName webAppHostName sqlServerFqdn databaseName; do
            echo "$k=$(echo "$out" | jq -r ".$k.value")" >> "$GITHUB_OUTPUT"
          done

  # ---------------------------------------------------------------- 2
  get-connection-string:
    name: 2. Get Connection String
    runs-on: ubuntu-latest
    needs: create-resources
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build connection string and store it in App Settings
        env:
          SQL_SERVER: ${{ needs.create-resources.outputs.sqlServerFqdn }}
          SQL_DB: ${{ needs.create-resources.outputs.databaseName }}
          WEBAPP: ${{ needs.create-resources.outputs.webAppName }}
          SQL_USER: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_PASS: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          CONN="Server=tcp:${SQL_SERVER},1433;Database=${SQL_DB};User ID=${SQL_USER};Password=${SQL_PASS};Encrypt=true;TrustServerCertificate=false;Connection Timeout=30;"
          echo "::add-mask::$CONN"
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP" \
            --settings "SQL_CONNECTION_STRING=$CONN" \
            --output none
          echo "SQL_CONNECTION_STRING stored in App Settings of $WEBAPP"

  # ---------------------------------------------------------------- 3
  deploy-app:
    name: 3. Deploy Application
    runs-on: ubuntu-latest
    needs: [create-resources, get-connection-string]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install production dependencies
        working-directory: app
        run: npm install --omit=dev --no-audit --no-fund

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.create-resources.outputs.webAppName }}
          package: app

  # ---------------------------------------------------------------- 4
  test:
    name: 4. Test deployment
    runs-on: ubuntu-latest
    needs: [create-resources, deploy-app]
    env:
      URL: https://${{ needs.create-resources.outputs.webAppHostName }}
    steps:
      - name: Wait for app health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "App did not become healthy"; exit 1

      - name: Verify database connectivity
        run: |
          resp=$(curl -sf "$URL/api/db-status")
          echo "$resp"
          echo "$resp" | jq -e '.connected == true'

      - name: Verify database read/write
        run: |
          marker="ci-test-$GITHUB_RUN_ID"
          curl -sf -X POST "$URL/api/notes" -H 'Content-Type: application/json' \
            -d "{\"text\":\"$marker\"}" | jq .
          curl -sf "$URL/api/notes" | jq -e --arg m "$marker" 'map(select(.Text == $m)) | length >= 1'
          echo "Write and read-back succeeded"
